name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # secret scanner checks the full reachable Git history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: test -z "$(gofmt -l .)"
      - run: go mod tidy -diff
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified experimental tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          test -f "$notes"
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "$RELEASE_TAG — Experimental" --notes-file "$notes"
